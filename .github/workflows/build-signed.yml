name: Build Signed APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Setup Android SDK components
      run: |
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        
    - name: Accept Android SDK licenses and install packages
      run: |
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-30" "build-tools;30.0.3" || true
        
    - name: Create keystore
      run: |
        keytool -genkey -v -keystore release-key.keystore -storepass android -alias release -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=BrightnessControl, OU=Dev, O=BrightnessControl, L=City, S=State, C=ID"
        
    - name: Build signed APK
      run: |
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=$PWD/release-key.keystore \
          -Pandroid.injected.signing.store.password=android \
          -Pandroid.injected.signing.key.alias=release \
          -Pandroid.injected.signing.key.password=android
          
    - name: Rename signed APK
      run: |
        mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/brightness-control-signed.apk || true
        mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/brightness-control-signed.apk || true
        
    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: brightness-control-signed
        path: app/build/outputs/apk/release/brightness-control-signed.apk
