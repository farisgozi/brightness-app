name: Build APK - Simple

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 30
        target: default
        arch: x86_64
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace
      
    - name: Build release APK  
      run: ./gradlew assembleRelease --no-daemon --stacktrace
      
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: brightness-control-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: brightness-control-release-apk
        path: app/build/outputs/apk/release/app-release-unsigned.apk
        
    - name: Create Release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Brightness Control v1.0.${{ github.run_number }}
        body: |
          🎉 **Brightness Control APK Ready!**
          
          📱 **For Oppo A5s with Ancient OS (Android 10)**
          
          ### 📦 Downloads:
          - **app-debug.apk**: For testing and development
          - **app-release-unsigned.apk**: For production use
          
          ### ✅ Requirements:
          - Android 5.0+ (API 21+)
          - **ROOT ACCESS REQUIRED**
          - Enable "Unknown Sources" for APK installation
          - Grant SuperUser permission when prompted
          - Enable overlay permission (Display over other apps)
          - Enable write settings permission
          
          ### 🚀 Installation Steps:
          1. Download APK to your device
          2. Enable "Install unknown apps" for your file manager
          3. Tap the APK to install
          4. Open app and grant SuperUser permission
          5. Enable required permissions in Settings
          6. Start the brightness service
          
          ### 🎯 Features:
          - Direct access to `/sys/class/leds/lcd-backlight/brightness`
          - Max brightness: 2047 (bypassing ROM GSI limitations)
          - Floating widget with drag & drop functionality
          - Auto-startup on device boot
          - Persistent background service
          - Manual brightness control interface
          
          **Tested specifically for Oppo A5s with Ancient OS ROM GSI**
          
          ### 🆘 Need Help?
          Check the troubleshooting guide in the repository for common issues.
        files: |
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/release/app-release-unsigned.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
