name: Build Brightness Control APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Setup Android SDK components
      run: |
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        
    - name: Accept Android SDK licenses and install packages
      run: |
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-30" "build-tools;30.0.3" || true
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
        
    - name: Build debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace
      
    - name: Build release APK
      run: ./gradlew assembleRelease --no-daemon --stacktrace
      
    - name: List APK outputs (Debug info)
      if: always()
      run: |
        echo "=== Project Structure ==="
        find . -name "build.gradle*" -o -name "settings.gradle*" | head -10
        
        echo "=== APK Search ==="
        find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
        
        echo "=== Build Outputs ==="
        ls -la app/build/outputs/apk/ 2>/dev/null || echo "APK output directory not found"
        ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "Debug APK directory not found"
        ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "Release APK directory not found"
      
    - name: Upload Debug APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: brightness-control-debug
        path: |
          app/build/outputs/apk/debug/*.apk
          */build/outputs/apk/debug/*.apk
        if-no-files-found: warn
        
    - name: Upload Release APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: brightness-control-release
        path: |
          app/build/outputs/apk/release/*.apk
          */build/outputs/apk/release/*.apk
        if-no-files-found: warn
        
    - name: Create Release
      if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Brightness Control v1.0.${{ github.run_number }}
        body: |
          🎉 **Brightness Control APK Ready!**
          
          📱 **For Oppo A5s with Ancient OS (Android 10)**
          
          ### 📦 Downloads:
          - **Debug APK**: For testing
          - **Release APK**: For production use
          
          ### ✅ Requirements:
          - Android 5.0+ (API 21+)
          - **ROOT ACCESS REQUIRED**
          - Overlay permission
          - Write settings permission
          
          ### 🚀 Installation:
          1. Download APK
          2. Enable "Unknown Sources" 
          3. Install APK
          4. Grant SuperUser permission
          5. Enable overlay & write settings permissions
          6. Start brightness service
          
          ### 🎯 Features:
          - Direct access to `/sys/class/leds/lcd-backlight/brightness`
          - Max brightness: 2047 (bypassing ROM limitations)
          - Floating widget with drag & drop
          - Auto-startup on boot
          - Background service
          
          **Tested on Oppo A5s with Ancient OS ROM GSI**
        files: |
          app/build/outputs/apk/debug/*.apk
          app/build/outputs/apk/release/*.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}